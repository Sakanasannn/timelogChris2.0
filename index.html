<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7fb"><title>TimeLog</title><link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#fdfda8;--card:#d8ebeb;--ink:#222638;--muted:#568284;--line:#4c71f4;--accent:#586bd8;--danger:#d34f65}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,sans-serif;padding:env(safe-area-inset-top) 0 30px}
.app{max-width:960px;margin:auto;padding:18px 14px}.top,.head,.row{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap}.brand{font-size:26px;font-weight:800}.muted,small{color:var(--muted);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 7px 22px #20284a0a}.head{margin-bottom:12px}.head h2{font-size:16px;margin:0}
button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}.btn{background:#f0f1f8;padding:10px 13px;border-radius:11px;color:var(--ink)}.primary{background:var(--accent);color:white;padding:11px 15px;border-radius:12px;font-weight:700}.danger{color:var(--danger)}
.habits{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px}.habit{background:#f8f8fc;border:1px solid var(--line);border-radius:13px;padding:14px;text-align:left;display:flex;align-items:center;gap:9px;font-weight:650;color:var(--ink);min-height:54px}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}.tabs{display:flex;background:#f0f1f8;padding:4px;border-radius:11px}.tabs button{flex:1;background:transparent;padding:8px;border-radius:8px;color:var(--muted)}.tabs button.active{background:white;color:var(--ink);font-weight:700}
.field{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:white;color:var(--ink)}label{display:block;color:var(--muted);font-size:12px;margin:10px 0 6px}
.chart{height:300px;width:100%}.chart canvas{width:100%;height:100%}.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}.legend label{display:flex;align-items:center;gap:5px;margin:0;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f7f8fc;padding:10px;border-radius:12px}.stat b{font-size:20px;display:block}.record{padding:11px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:8px}.record:last-child{border:0}.recordmeta{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted);font-size:12px;margin-top:4px}.mini{padding:7px 9px;border-radius:9px;background:#f0f1f8;font-size:12px}.hidden{display:none!important}.empty{text-align:center;padding:25px;color:var(--muted);font-size:13px}
.modal{position:fixed;inset:0;background:#10132677;z-index:5;display:flex;align-items:flex-end;justify-content:center;padding:12px}.dialog{background:white;border-radius:20px;padding:18px;width:min(100%,560px);max-height:90vh;overflow:auto}.close{float:right;background:#f0f1f8;padding:7px 10px;border-radius:9px}

.chris-card{border-color:#dfe4f6;background:linear-gradient(145deg,#fff 0%,#f8f9ff 100%)}
.chris-line{font-size:17px;line-height:1.9;white-space:pre-wrap;padding:15px 2px;min-height:76px}
.chris-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12px}
.chris-actions{display:flex;gap:8px;flex-wrap:wrap}.chris-actions button{flex:1;min-width:110px}
.chris-collection-wrap{margin-top:12px}.chris-collection{font-size:13px}.chris-collection-header{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}.chris-collection-total,.chris-collection-progress{color:var(--muted);font-size:12px}.chris-collection-progress{margin:8px 0}.chris-collection-progress-fill{height:6px;background:#6879d8;border-radius:99px}.chris-collection-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:12px 0}.chris-collection-tab{background:#f0f1f8;color:var(--ink);padding:9px;border-radius:9px}.chris-collection-tab.active{background:#e5e9ff;color:#3549ad;font-weight:700}.chris-collection-pool-heading{font-weight:700;margin:12px 0 8px}.chris-collection-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:7px}.chris-collection-entry{border:1px solid var(--line);border-radius:11px;padding:10px;background:#fff}.chris-collection-entry summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px}.chris-collection-entry summary::-webkit-details-marker{display:none}.chris-collection-text{line-height:1.8;white-space:pre-wrap;padding-top:9px}.chris-collection-id,.chris-collection-status{color:var(--muted);font-size:11px}.chris-collection-entry.locked{background:#f8f8fb;color:#999}

.profile-tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:4px;background:#f0f1f8;border-radius:12px;margin:4px 0 12px}
.profile-tabs button{background:transparent;color:var(--muted);padding:10px;border-radius:9px}
.profile-tabs button.active{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 4px #20284a12}
.chris-collection-date{font-size:11px;color:var(--muted);padding-top:5px}
.chris-collection-question{font-size:18px;font-weight:800;color:#9aa0b2;display:inline-block;min-width:25px}
.chris-collection-check{color:#35a58a;font-weight:800;display:inline-block;min-width:25px}


@media(min-width:720px){.app{padding:26px}.cols{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}.cols .card{margin:12px 0}}
</style></head><body><main class="app">
<header class="top"><div><div class="brand">TimeLog</div><div class="muted">把每一次打卡，变成看得见的时间轨迹</div></div><button class="btn" id="settings">⚙ 设置</button></header>
<section class="card"><div class="head"><h2>快速打卡</h2><span class="muted" id="clock"></span></div><div class="habits" id="quick"></div><div class="row" style="justify-content:flex-start;margin-top:12px"><button class="btn" id="add">＋ 新建习惯</button><small>点击习惯即可记录当前时间</small></div></section>
<div class="cols"><section class="card"><div class="head"><h2>时间趋势</h2><span class="muted" id="range"></span></div>
<div class="tabs" id="tabs"><button class="active" data-v="week">周</button><button data-v="month">月</button><button data-v="year">年</button></div>
<div class="row" style="margin:12px 0"><button class="btn" id="prev">‹</button><b id="period"></b><button class="btn" id="next">›</button></div>
<div id="ymode" class="hidden"><label>年视图显示方式</label><select class="field" id="yearMode"><option value="median">月度中位数趋势</option><option value="all">全年所有打卡点</option><option value="both">中位数趋势 + 原始数据</option></select></div>
<div class="chart"><canvas id="plot"></canvas></div><div class="legend" id="legend"></div><p class="muted" id="hint">纵轴会根据可见数据自动缩放。</p></section>
<section class="card"><div class="head"><h2>概览</h2><small>当前视图</small></div><div class="stats"><div class="stat"><b id="count">0</b><small>打卡次数</small></div><div class="stat"><b id="hcount">0</b><small>活跃习惯</small></div><div class="stat"><b id="days">0</b><small>有记录天数</small></div></div><div class="head" style="margin-top:18px"><h2>习惯管理</h2><button class="mini" id="manage">管理全部</button></div><div id="summary"></div></section></div>
<section class="card" id="profilePanel">
  <div class="head"><h2>个人资料</h2><button class="mini" id="panelToggle" type="button">收起内容</button></div>
  <div class="profile-tabs" id="profileTabs">
    <button type="button" data-profile-tab="records" class="active">打卡记录</button>
    <button type="button" data-profile-tab="collection">Chris 收藏</button>
  </div>
  <div id="profileContent">
    <div id="recordsPane">
      <div class="row" style="margin:12px 0"><input class="field" id="search" placeholder="搜索习惯或备注" style="flex:1;min-width:145px"><select class="field" id="filter" style="width:auto"><option value="">全部习惯</option></select><button class="mini" id="export">导出 / 恢复</button></div>
      <div id="records"></div><div class="row" style="justify-content:center"><button class="btn" id="more">显示更多</button></div>
    </div>
    <div id="collectionPane" class="hidden"><div id="collectionPage" class="chris-collection-wrap"><div class="empty">收藏数据加载中……</div></div></div>
  </div>
</section>
<p class="muted" style="text-align:center">数据保存在当前设备。请定期导出 JSON 备份。</p></main><div id="modal"></div>
<script src="./chris-lines.js"></script>
<script src="./seasonal-lines.js"></script>
<script src="./collection.js"></script>
<script>
const $=s=>document.querySelector(s), KEY='timelog-complete-v1', COLORS=['#5876d8','#e18b52','#35a58a','#b16bc3','#d45d79','#8b9b42','#4f9db9','#a17c59','#68718e','#d0a23d'];
let data={habits:[],records:[],chrisCollection:null},view='week',offset=0,visible=new Set(),limit=20,ymode='median';
const id=()=>Math.random().toString(36).slice(2,10), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const day=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`, start=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate()), plus=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
let idb=null;
let profileTab='records', profileCollapsed=false;
try{profileTab=localStorage.getItem('timelog-profile-tab-v1')||'records';profileCollapsed=localStorage.getItem('timelog-profile-collapsed-v1')==='1'}catch(e){}
function applyProfilePanel(){
  const records=$('#recordsPane'), collection=$('#collectionPane'), content=$('#profileContent'), toggle=$('#panelToggle');
  if(!records||!collection||!content||!toggle)return;
  records.classList.toggle('hidden',profileTab!=='records');
  collection.classList.toggle('hidden',profileTab!=='collection');
  content.classList.toggle('hidden',profileCollapsed);
  toggle.textContent=profileCollapsed?'展开内容':'收起内容';
  document.querySelectorAll('[data-profile-tab]').forEach(b=>b.classList.toggle('active',b.dataset.profileTab===profileTab));
}
function openDB(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window))return resolve(null);let req=indexedDB.open('TimeLogDatabase',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('state'))req.result.createObjectStore('state')};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function save(){if(window.ChrisCollection)data.chrisCollection=ChrisCollection.getState();try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}if(idb){try{let tx=idb.transaction('state','readwrite');tx.objectStore('state').put(data,'main')}catch(e){}}}
async function init(){try{idb=await openDB();if(idb){let saved=await new Promise((resolve,reject)=>{let q=idb.transaction('state','readonly').objectStore('state').get('main');q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)});if(saved)data=saved;else{try{data=JSON.parse(localStorage.getItem(KEY))||data}catch(e){}}}else{try{data=JSON.parse(localStorage.getItem(KEY))||data}catch(e){}}}catch(e){try{data=JSON.parse(localStorage.getItem(KEY))||data}catch(_){}}if(!data.habits?.length)data.habits=[{id:'sleep',name:'睡觉',color:COLORS[0],active:true},{id:'wake',name:'起床',color:COLORS[1],active:true},{id:'study',name:'学习',color:COLORS[2],active:true}];data.records??=[];data.habits.forEach(h=>visible.add(h.id));if(window.ChrisCollection&&data.chrisCollection)ChrisCollection.restoreState(data.chrisCollection);else if(window.ChrisCollection)data.chrisCollection=ChrisCollection.getState();save()}
const getH=x=>data.habits.find(h=>h.id===x);
function range(){let n=new Date();if(view==='week'){let s=plus(start(n),-((n.getDay()+6)%7)+offset*7);return{s,e:plus(s,7),label:`${day(s)} — ${day(plus(s,6))}`}}if(view==='month'){let s=new Date(n.getFullYear(),n.getMonth()+offset,1);return{s,e:new Date(s.getFullYear(),s.getMonth()+1,1),label:`${s.getFullYear()}年${s.getMonth()+1}月`}}let y=n.getFullYear()+offset;return{s:new Date(y,0,1),e:new Date(y+1,0,1),label:`${y}年`}}
function periodRecords(){let p=range();return data.records.filter(r=>r.ts>=+p.s&&r.ts<+p.e&&visible.has(r.habitId)&&getH(r.habitId)?.active)}
function modal(content){$('#modal').innerHTML=`<div class="modal" id="shade"><div class="dialog">${content}</div></div>`;$('#shade').onclick=e=>{if(e.target.id==='shade')close()};$('#close')?.addEventListener('click',close)}
function close(){$('#modal').innerHTML=''}
function localInput(t){let d=new Date(t),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`}
function getChrisDialogueType(hid){
  if(hid==='wake')return 'morning';
  if(hid==='sleep')return 'night';
  return null;
}
function editRecord(hid,rec=null){
  modal(`<button class="close" id="close">✕</button><h3>${rec?'编辑记录':'打卡：'+esc(getH(hid).name)}</h3><label>日期与时间</label><input class="field" type="datetime-local" step="1" id="when" value="${localInput(rec?.ts??Date.now())}"><label>备注 / 感言（选填）</label><textarea class="field" rows="3" id="note">${esc(rec?.note||'')}</textarea><div class="row" style="justify-content:flex-start;margin-top:14px"><button class="primary" id="saveRec">保存</button><button class="btn" id="cancel">取消</button></div>`);
  $('#cancel').onclick=close;
  $('#saveRec').onclick=()=>{
    let t=+new Date($('#when').value);
    if(!Number.isFinite(t))return alert('请选择有效时间');
    const isNew=!rec;
    if(rec){rec.ts=t;rec.note=$('#note').value.trim()}
    else data.records.push({id:id(),habitId:hid,ts:t,note:$('#note').value.trim()});
    data.records.sort((a,b)=>a.ts-b.ts);save();close();render();
    // 只有新建 wake/sleep 打卡会触发；编辑历史记录或其他习惯不触发。
    if(isNew){const dialogueType=getChrisDialogueType(hid);if(dialogueType)showChrisDialogue(dialogueType)}
  };
}
function addHabit(){modal(`<button class="close" id="close">✕</button><h3>新建习惯</h3><label>名称</label><input class="field" id="newname" placeholder="例如：运动、阅读"><label>颜色</label><input class="field" type="color" id="newcolor" value="${COLORS[data.habits.length%COLORS.length]}"><button class="primary" style="margin-top:15px" id="create">创建</button>`);$('#create').onclick=()=>{let name=$('#newname').value.trim();if(!name)return alert('请填写名称');let h={id:id(),name,color:$('#newcolor').value,active:true};data.habits.push(h);visible.add(h.id);save();close();render()}}
function editHabit(hid){let h=getH(hid);modal(`<button class="close" id="close">✕</button><h3>习惯设置</h3><label>名称</label><input class="field" id="hn" value="${esc(h.name)}"><label>颜色</label><input class="field" type="color" id="hc" value="${h.color}"><label><input type="checkbox" id="ha" ${h.active?'checked':''}> 在打卡和图表中显示</label><div class="row" style="justify-content:flex-start;margin-top:15px"><button class="primary" id="hs">保存</button><button class="btn danger" id="hd">删除习惯</button></div>`);$('#hs').onclick=()=>{h.name=$('#hn').value.trim()||h.name;h.color=$('#hc').value;h.active=$('#ha').checked;save();close();render()};$('#hd').onclick=()=>{if(confirm('删除该习惯及其全部历史记录？不可撤销。')){data.habits=data.habits.filter(x=>x.id!==hid);data.records=data.records.filter(x=>x.habitId!==hid);visible.delete(hid);save();close();render()}}}
function draw(){let c=$('#plot'),ctx=c.getContext('2d'),r=c.getBoundingClientRect(),dpr=devicePixelRatio||1;c.width=r.width*dpr;c.height=r.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);let w=r.width,h=r.height;ctx.clearRect(0,0,w,h);let p=range(),rs=periodRecords(),hs=data.habits.filter(x=>x.active&&visible.has(x.id)),pts=[];
const minute=t=>{let d=new Date(t);return d.getHours()*60+d.getMinutes()+d.getSeconds()/60};
const xof=t=>{let d=new Date(t);return view==='week'?Math.floor((start(d)-p.s)/86400000):view==='month'?d.getDate()-1:d.getMonth()};
function circMedian(a){a=a.map(x=>(x%1440+1440)%1440).sort((x,y)=>x-y);if(a.length===1)return a[0];let g=-1,k=0;for(let i=0;i<a.length;i++){let z=(i===a.length-1?a[0]+1440:a[i+1])-a[i];if(z>g){g=z;k=i}}let s=a[(k+1)%a.length],u=a.map(x=>x<s?x+1440:x).sort((x,y)=>x-y),n=u.length,m=n%2?u[(n-1)/2]:(u[n/2-1]+u[n/2])/2;return m%1440}
if(view==='year'&&ymode!=='all'){hs.forEach(hb=>{for(let m=0;m<12;m++){let a=rs.filter(x=>x.habitId===hb.id&&new Date(x.ts).getMonth()===m).map(x=>minute(x.ts));if(a.length)pts.push({habitId:hb.id,x:m,y:circMedian(a),med:true})}})}else rs.forEach(x=>pts.push({habitId:x.habitId,x:xof(x.ts),y:minute(x.ts),ts:x.ts}));
if(view==='year'&&ymode==='both')rs.forEach(x=>pts.push({habitId:x.habitId,x:new Date(x.ts).getMonth(),y:minute(x.ts),raw:true}));
if(!pts.length){ctx.fillStyle='#8990a2';ctx.textAlign='center';ctx.font='13px sans-serif';ctx.fillText('当前范围还没有打卡记录',w/2,h/2);$('#legend').innerHTML='';return}
let series=[];hs.forEach(hb=>{let a=(view==='year'&&ymode!=='all')?pts.filter(x=>x.habitId===hb.id&&x.med).sort((x,y)=>x.x-y.x):rs.filter(x=>x.habitId===hb.id).sort((x,y)=>x.ts-y.ts).map(x=>({habitId:hb.id,x:xof(x.ts),y:minute(x.ts)}));let off=0,prev=null;a=a.map(x=>{if(prev!==null){let delta=x.y-prev;if(delta < -720)off+=1440;else if(delta>720)off-=1440}prev=x.y;return{...x,y:x.y+off}});series.push(...a)});
if(view==='year'&&ymode==='both')series.push(...pts.filter(x=>x.raw));
let ys=series.map(x=>x.y),lo=Math.min(...ys),hi=Math.max(...ys);if(hi-lo<60){let m=(hi+lo)/2;lo=m-60;hi=m+60}let span=hi-lo,step=span<=240?30:span<=600?60:120;lo=Math.floor((lo-15)/step)*step;hi=Math.ceil((hi+15)/step)*step;
let xmax=view==='week'?6:view==='month'?new Date(p.s.getFullYear(),p.s.getMonth()+1,0).getDate()-1:11,pad={l:52,r:12,t:14,b:34},pw=w-pad.l-pad.r,ph=h-pad.t-pad.b,X=x=>pad.l+x/Math.max(1,xmax)*pw,Y=y=>pad.t+(hi-y)/(hi-lo)*ph;
ctx.strokeStyle='#e9ebf2';ctx.fillStyle='#7d8295';ctx.font='10px sans-serif';ctx.textAlign='right';for(let y=lo;y<=hi;y+=step){let yy=Y(y);ctx.beginPath();ctx.moveTo(pad.l,yy);ctx.lineTo(w-pad.r,yy);ctx.stroke();let m=((Math.round(y)%1440)+1440)%1440;ctx.fillText(String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'),pad.l-7,yy+3)}
ctx.textAlign='center';for(let x=0;x<=xmax;x++){if(view==='week'&&x>6)continue;ctx.fillText(view==='week'?['一','二','三','四','五','六','日'][x]:view==='month'?String(x+1):`${x+1}月`,X(x),h-10)}
hs.forEach(hb=>{let a=series.filter(x=>x.habitId===hb.id&&!x.raw).sort((x,y)=>x.x-y.x);if(!a.length)return;ctx.strokeStyle=hb.color;ctx.fillStyle=hb.color;ctx.lineWidth=2;ctx.beginPath();a.forEach((x,i)=>i?ctx.lineTo(X(x.x),Y(x.y)):ctx.moveTo(X(x.x),Y(x.y)));ctx.stroke();a.forEach(x=>{ctx.beginPath();ctx.arc(X(x.x),Y(x.y),3.5,0,Math.PI*2);ctx.fill()})});
if(view==='year'&&ymode==='both'){ctx.globalAlpha=.35;series.filter(x=>x.raw).forEach(x=>{ctx.fillStyle=getH(x.habitId)?.color||'#888';ctx.beginPath();ctx.arc(X(x.x),Y(x.y),2,0,7);ctx.fill()});ctx.globalAlpha=1}
$('#legend').innerHTML=hs.map(hb=>`<label><input type="checkbox" data-vis="${hb.id}" ${visible.has(hb.id)?'checked':''}><i class="dot" style="background:${hb.color}"></i>${esc(hb.name)}</label>`).join('');document.querySelectorAll('[data-vis]').forEach(x=>x.onchange=()=>{x.checked?visible.add(x.dataset.vis):visible.delete(x.dataset.vis);render()});
$('#hint').textContent=view==='year'&&ymode!=='all'?'月度中位数采用环形时间计算，避免 23:50 与 00:10 被平均成中午。':'纵轴根据当前可见数据动态缩放；跨午夜按同一习惯的记录顺序展开。'}
function render(){let p=range();$('#clock').textContent=new Date().toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});$('#period').textContent=p.label;$('#range').textContent={week:'周视图',month:'月视图',year:'年视图'}[view];$('#ymode').classList.toggle('hidden',view!=='year');
$('#quick').innerHTML=data.habits.filter(x=>x.active).map(x=>`<button class="habit" data-check="${x.id}"><i class="dot" style="background:${x.color}"></i>${esc(x.name)}</button>`).join('')||'<div class="empty">请先创建习惯</div>';document.querySelectorAll('[data-check]').forEach(x=>x.onclick=()=>editRecord(x.dataset.check));
let rs=periodRecords();$('#count').textContent=rs.length;$('#hcount').textContent=new Set(rs.map(x=>x.habitId)).size;$('#days').textContent=new Set(rs.map(x=>day(new Date(x.ts)))).size;
$('#summary').innerHTML=data.habits.map(x=>`<div class="record"><div><b><i class="dot" style="background:${x.color}"></i> ${esc(x.name)}</b><div class="recordmeta">${data.records.filter(r=>r.habitId===x.id).length} 条记录 ${x.active?'':'· 已隐藏'}</div></div><button class="mini" data-edit-h="${x.id}">设置</button></div>`).join('');document.querySelectorAll('[data-edit-h]').forEach(x=>x.onclick=()=>editHabit(x.dataset.editH));
let q=$('#search').value.toLowerCase(),f=$('#filter').value,all=[...data.records].sort((a,b)=>b.ts-a.ts).filter(x=>(!f||x.habitId===f)&&(`${getH(x.habitId)?.name||''} ${x.note||''}`).toLowerCase().includes(q));$('#filter').innerHTML='<option value="">全部习惯</option>'+data.habits.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');$('#filter').value=f;
$('#records').innerHTML=all.slice(0,limit).map(x=>`<div class="record"><div><b><i class="dot" style="background:${getH(x.habitId)?.color||'#aaa'}"></i> ${esc(getH(x.habitId)?.name||'已删除')}</b><div class="recordmeta">${new Date(x.ts).toLocaleString('zh-CN',{hour12:false})}${x.note?'\\n'+esc(x.note):''}</div></div><div class="row"><button class="mini" data-er="${x.id}">编辑</button><button class="mini danger" data-dr="${x.id}">删除</button></div></div>`).join('')||'<div class="empty">没有匹配记录</div>';$('#more').classList.toggle('hidden',all.length<=limit);
document.querySelectorAll('[data-er]').forEach(b=>b.onclick=()=>{let x=data.records.find(r=>r.id===b.dataset.er);editRecord(x.habitId,x)});document.querySelectorAll('[data-dr]').forEach(b=>b.onclick=()=>{if(confirm('删除这条记录？')){data.records=data.records.filter(x=>x.id!==b.dataset.dr);save();render()}});
draw()}
function download(blob,name){let a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function backup(){if(window.ChrisCollection)data.chrisCollection=ChrisCollection.getState();download(new Blob([JSON.stringify({format:'TimeLog',version:2,exportedAt:new Date().toISOString(),...data},null,2)],{type:'application/json'}),`TimeLog-backup-${day(new Date())}.json`)}
function csv(){let rows=[['id','habit','timestamp_iso','local_datetime','note'],...data.records.map(x=>[x.id,getH(x.habitId)?.name||'',new Date(x.ts).toISOString(),new Date(x.ts).toLocaleString('zh-CN',{hour12:false}),x.note||''])];download(new Blob(['\\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\\r\\n')],{type:'text/csv;charset=utf-8'}),`TimeLog-${day(new Date())}.csv`)}
function exportUI(){modal(`<button class="close" id="close">✕</button><h3>数据导出 / 恢复</h3><p class="muted">JSON 包含全部习惯与记录；CSV 可用 Excel 打开。</p><div class="row" style="justify-content:flex-start"><button class="primary" id="json">导出 JSON 备份</button><button class="btn" id="csv">导出 CSV</button></div><label>选择 JSON 备份恢复（将覆盖当前数据）</label><input class="field" type="file" id="file" accept="application/json"><button class="btn" id="restore" style="margin-top:10px">恢复备份</button>`);$('#json').onclick=backup;$('#csv').onclick=csv;$('#restore').onclick=()=>{let f=$('#file').files[0];if(!f)return alert('请先选择文件');let rd=new FileReader();rd.onload=()=>{try{let o=JSON.parse(rd.result);if(!Array.isArray(o.habits)||!Array.isArray(o.records))throw 0;if(confirm('确定覆盖当前全部数据？')){data={habits:o.habits,records:o.records,chrisCollection:o.chrisCollection??null};visible=new Set(data.habits.map(x=>x.id));if(window.ChrisCollection&&o.chrisCollection)ChrisCollection.restoreState(o.chrisCollection);save();close();render();renderChrisCollection()}}catch(e){alert('备份文件无效')}};rd.readAsText(f)}}
function showChrisDialogue(type){
  if(!window.ChrisCollection){alert('Chris 台词模块尚未加载，请检查 chris-lines.js、seasonal-lines.js、collection.js 是否与 index.html 位于同一目录。');return}
  const d=ChrisCollection.getDialogue(type,new Date());
  if(!d)return;
  const label=type==='morning'?'早晨':'夜间';
  const status=d.newlyUnlocked?'新收藏已解锁':'普通台词已收录';
  modal(`<button class="close" id="close">✕</button><div style="color:#7d8295;font-size:12px;margin:6px 0 12px">${label} · ${esc(d.id||'')} · ${status}</div><div style="font-size:18px;line-height:1.95;white-space:pre-wrap;padding:8px 0 18px">「${esc(d.text)}」</div><div class="row" style="justify-content:flex-end"><button class="primary" id="dialogueOK">知道了</button></div>`);
  $('#dialogueOK').onclick=close;
  renderChrisCollection();
}
function renderChrisCollection(){const el=$('#collectionPage');if(!el)return;if(window.ChrisCollection)ChrisCollection.render(el);else el.innerHTML='<div class="empty">Chris 台词模块尚未加载。请确认 chris-lines.js、seasonal-lines.js、collection.js 与 index.html 位于同一目录。</div>'}
$('#add').onclick=addHabit;$('#manage').onclick=()=>{modal(`<button class="close" id="close">✕</button><h3>习惯管理</h3><div id="ml"></div><button class="primary" id="ma" style="margin-top:12px">＋ 新建习惯</button>`);$('#ml').innerHTML=data.habits.map(x=>`<div class="record"><b><i class="dot" style="background:${x.color}"></i> ${esc(x.name)}</b><button class="mini" data-mh="${x.id}">设置</button></div>`).join('');document.querySelectorAll('[data-mh]').forEach(b=>b.onclick=()=>{let x=b.dataset.mh;close();editHabit(x)});$('#ma').onclick=()=>{close();addHabit()}};
$('#settings').onclick=()=>{modal(`<button class="close" id="close">✕</button><h3>设置</h3><p class="muted">数据优先保存在本设备 IndexedDB 中，并保留本地备用副本。清除网站数据或更换设备仍可能导致记录丢失，请定期备份。</p><button class="primary" id="bk">导出 JSON 备份</button><p class="muted">此版本不连接 AI，也不会将打卡内容发送给 AI 服务。</p>`);$('#bk').onclick=backup};
$('#export').onclick=exportUI;$('#search').oninput=()=>{limit=20;render()};$('#filter').onchange=render;$('#more').onclick=()=>{limit+=20;render()};
$('#tabs').onclick=e=>{let b=e.target.closest('[data-v]');if(!b)return;view=b.dataset.v;offset=0;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x===b));render()};$('#prev').onclick=()=>{offset--;render()};$('#next').onclick=()=>{if(offset<0){offset++;render()}};$('#yearMode').onchange=e=>{ymode=e.target.value;draw()};
$('#profileTabs').onclick=e=>{const b=e.target.closest('[data-profile-tab]');if(!b)return;profileTab=b.dataset.profileTab;try{localStorage.setItem('timelog-profile-tab-v1',profileTab)}catch(_){}applyProfilePanel();if(profileTab==='collection')renderChrisCollection()};
$('#panelToggle').onclick=()=>{profileCollapsed=!profileCollapsed;try{localStorage.setItem('timelog-profile-collapsed-v1',profileCollapsed?'1':'0')}catch(_){}applyProfilePanel()};
init().then(()=>{render();renderChrisCollection();applyProfilePanel()});setInterval(()=>$('#clock').textContent=new Date().toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}),1000);window.addEventListener('resize',draw);
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
